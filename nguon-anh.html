<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bảng đối chiếu ảnh · Chạm Cửa Việt</title>
<style>
@font-face{font-family:Be;src:url(assets/be-vietnam-400.woff)}@font-face{font-family:Be;src:url(assets/be-vietnam-700.woff);font-weight:700}
*{box-sizing:border-box}body{margin:0;color:#163936;background:#f5f9f7;font:16px/1.65 Be,system-ui,sans-serif}main{max-width:960px;margin:auto;padding:32px 20px 64px}h1{line-height:1.15;margin:.7em 0 .3em;font-family:Georgia,serif;font-size:clamp(32px,5vw,50px)}a{color:#125e55;text-underline-offset:3px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav a{border:1px solid #aac6ba;border-radius:20px;padding:5px 12px;text-decoration:none;background:white}nav a[aria-current]{background:#164c43;color:white}ul{padding:0;list-style:none}li{display:grid;grid-template-columns:100px 1fr;gap:15px;padding:16px 0;border-top:1px solid #ccdad4}li img{display:block;width:100px;height:76px;object-fit:contain;border-radius:6px;background:#e8eeea}li p{margin:0 0 4px}li small{display:block;font-size:.83rem;color:#42665a}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:460px){li{grid-template-columns:74px 1fr;gap:10px}li img{width:74px;height:64px}}@media print{nav,.back{display:none}main{padding:0}li{break-inside:avoid}}
</style>
<script defer src="photo-catalog.js?v=20261127-hai-san"></script>
<link rel="stylesheet" href="liquid-glass.css?v=12">
</head><body class="glass-reference"><main>
<a class="back" href="./">← Về Chạm Cửa Việt</a>
<h1>Bảng đối chiếu ảnh</h1>
<p>Chọn một điểm chạm để xem từng ảnh, đọc chú thích và mở nguồn đối chiếu. Ngày đăng báo chỉ thời điểm công bố. Với tư liệu phỏng vấn, dòng nguồn ghi rõ ai cung cấp bản chụp.</p>
<nav aria-label="Lọc theo điểm chạm"><a href="#tat-ca">Tất cả</a><a href="#trang-chu">Trang chủ</a><a href="#cham-1">Chạm 1</a><a href="#cham-2">Chạm 2</a><a href="#cham-3">Chạm 3</a><a href="#cham-4">Chạm 4</a><a href="#cham-5">Chạm 5</a></nav>
<p id="count" role="status"></p><ul id="list"></ul>
<noscript>Hãy bật JavaScript để xem và lọc bảng đối chiếu.</noscript>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const nav = [...document.querySelectorAll('nav a')];
  function link(href, label) {
    const a = document.createElement('a');
    a.href = href; a.textContent = label; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }
  function row(path, meta) {
    const li = document.createElement('li');
    const imageURL = meta.previewSrc || path;
    const preview = link(imageURL, 'Mở ảnh');
    preview.setAttribute('aria-label', 'Mở ảnh: ' + meta.caption);
    if (!meta.locations.includes('Chạm 3 · ảnh dự phòng')) {
      const img = document.createElement('img');
      img.loading = 'lazy'; img.alt = ''; img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', () => preview.replaceChildren('Mở ảnh'), {once:true});
      img.src = imageURL; preview.replaceChildren(img);
    }
    const text = document.createElement('div'), scope = document.createElement('small');
    const desc = document.createElement('p'), credit = document.createElement('div');
    scope.textContent = meta.locations.join(' · ');
    desc.textContent = meta.caption;
    credit.append(meta.url ? link(meta.url, meta.label) : meta.label);
    if (meta.license) credit.append(' · ', link(meta.license, 'CC BY-SA 4.0'));
    text.append(scope, desc, credit); li.append(preview, text); return li;
  }
  function render() {
    const selected = nav.find(a => a.hash === location.hash) || nav[0];
    nav.forEach(a => { if(a===selected) a.setAttribute('aria-current','true'); else a.removeAttribute('aria-current'); });
    const scope = selected.textContent;
    const entries = Object.entries(photoCatalog).filter(([,m]) => m.locations && (selected === nav[0] || m.locations.some(s => s === scope || s.startsWith(scope + ' ·'))));
    entries.sort((a,b) => a[1].locations[0].localeCompare(b[1].locations[0], 'vi') || a[1].caption.localeCompare(b[1].caption,'vi'));
    document.getElementById('count').textContent = entries.length + ' mục ảnh · Đối chiếu ngày 25/11/2026';
    document.getElementById('list').replaceChildren(...entries.map(([path,meta]) => row(path,meta)));
  }
  window.addEventListener('hashchange',render); render();
});
</script></main></body></html>
