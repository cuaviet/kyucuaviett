          MANIFEST
          gh auth setup-git
          git clone --no-tags --single-branch --branch main "https://github.com/$GITHUB_REPOSITORY.git" website
          cd website
          git switch -c cham-cua-viet-pages-ready 44dd416583d53b25865d9329529ac0b36a1f253e
          while read -r digest path; do
            mkdir -p "$(dirname "$path")"
            if [[ "$path" == "./.nojekyll" ]]; then
              touch "$path"
            else
              entry="${path#./}"
              [[ "$entry" != "index.html" ]] || entry=""
              curl --fail --silent --show-error --location --retry 3 --max-time 90 --output "$path" "$SOURCE_URL/$entry"
            fi
          done < "$RUNNER_TEMP/site.sha256"
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'app.js', 'navigation.js', 'base.css', 'media-catalog.json'):
              path = Path(name)
              data = path.read_bytes()
              for prefix in (b'assets/', b'media/', b'media-catalog.json', b'app.js', b'navigation.js', b'base.css', b'site.css'):
                  data = data.replace(b'/' + prefix, prefix)
              data = data.replace(b'https://xanhx.vnmedia/', b'https://xanhx.vn/media/')
              path.write_bytes(data)
          PY
          sha256sum -c "$RUNNER_TEMP/site.sha256"
          git add .nojekyll index.html app.js navigation.js base.css site.css media-catalog.json assets media
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Cập nhật Chạm Cửa Việt với 5 điểm chạm'
          git push origin HEAD:refs/heads/cham-cua-viet-pages-ready
