<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#102f36">
  <title>CHẠM CỬA VIỆT — Tạm đóng</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(145deg,#091f28,#123e48 56%,#0b2832); color: #f6f3e9; padding: 24px; }
    main { width: min(100%,620px); text-align: center; padding: 44px 24px; border: 1px solid rgba(255,255,255,.22); border-radius: 24px; background: rgba(255,255,255,.055); box-shadow: 0 24px 65px rgba(0,0,0,.22); }
    .wave { display: block; font-size: 46px; line-height: 1; margin-bottom: 24px; }
    h1 { margin: 0 0 14px; font-size: clamp(26px,5vw,40px); letter-spacing: .02em; }
    p { font-size: clamp(16px,3vw,18px); line-height: 1.75; margin: 10px auto; max-width: 460px; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <span class="wave" aria-hidden="true">🌊</span>
    <h1 id="title">CHẠM CỬA VIỆT tạm đóng.</h1>
    <p>Cảm ơn bạn đã ghé thăm.</p>
    <p style="font-size:12px;opacity:.72">Lượt truy cập được thống kê ẩn danh; không ghi nhận thông tin cá nhân.</p>
  </main>
  <script defer src="analytics-config.js?v=2"></script>
  <script defer src="analytics.js?v=2"></script>
</body>
</html>
