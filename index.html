<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#123b45">
  <title>CHẠM CỬA VIỆT — Tạm đóng</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:#f9f4e7;background:linear-gradient(145deg,#091f28,#123e48 56%,#0b2832)}
    main{width:min(100%,620px);padding:48px 26px;text-align:center;border:1px solid #ffffff38;border-radius:24px;background:#ffffff0e;box-shadow:0 24px 65px #0004}
    .wave{display:block;font-size:50px;margin-bottom:22px}
    h1{font-size:clamp(28px,5vw,42px);margin:0 0 18px}
    p{font-size:clamp(16px,3vw,18px);line-height:1.75;margin:10px auto;max-width:480px}
    small{display:block;margin-top:28px;color:#c7d9d7;font-size:14px}
  </style>
</head>
<body>
  <main>
    <span class="wave" aria-hidden="true">🌊</span>
    <h1>CHẠM CỬA VIỆT</h1>
    <p><strong>Website hiện đang tạm đóng.</strong></p>
    <p>Trang web sẽ mở lại sau khi quá trình hoàn thiện kết thúc. Cảm ơn bạn đã quan tâm và đồng hành!</p>
    <small>Một cửa biển – Năm điểm chạm.</small>
  </main>
</body>
</html>
